<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>水面材质 GPU 对比</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf0ee;color:#193c3c;font:14px system-ui,sans-serif}
    header{padding:18px 24px 12px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{font-size:22px;font-weight:600;margin:0 0 5px}p{margin:0;color:#58716c}
    .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{border:1px solid #adc2bc;background:#fff;border-radius:6px;padding:8px 15px;color:#234b43;cursor:pointer}
    button[aria-pressed="true"]{background:#285d52;color:#fff;border-color:#285d52}label{display:flex;align-items:center;gap:5px;font-size:12px}input{width:100px}
    .labels{display:grid;grid-template-columns:1fr 1fr;text-align:center;background:#dde7e1;padding:10px;font-weight:600}
    #canvas{height:min(66vh,720px);min-height:360px;position:relative}canvas{display:block;width:100%;height:100%}
    #canvas:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#edf0ee;pointer-events:none}
    details{padding:12px 24px}summary{cursor:pointer;font-weight:600}pre{background:#f7faf8;color:#36564e;padding:12px;max-height:230px;overflow:auto;font:12px/1.45 monospace;white-space:pre-wrap}
    footer{padding:0 24px 14px;font-size:12px;color:#58716c}
  </style>
</head>
<body>
  <header>
    <div><h1>真实水面几何 · 材质对比</h1><p>409 顶点 / 1023 索引 · 同一环境、光照和相机 · 静态细波纹</p></div>
    <div class="controls">
      <button data-view="overview" aria-pressed="false">全景</button>
      <button data-view="near" aria-pressed="true">近看</button>
      <button data-view="grazing" aria-pressed="false">低角度</button>
      <label>波纹强度 <input id="strength" aria-label="波纹强度" type="range" min="0" max="0.6" step="0.01" value="0.12"><output id="strength-value">0.12</output></label>
    </div>
  </header>
  <div class="labels"><span>之前的水纹效果</span><span>自然细涟漪 · 更克制的反光</span></div>
  <div id="canvas"></div>
  <details open><summary id="status">正在编译与检测…</summary><pre id="report">Loading actual target geometry…</pre></details>
  <footer>独立验证场景；原始水色与几何不变。实际项目的环境、阴影和后期效果需在编辑器内复核。</footer>
  <script type="module">
    import * as THREE from '/node_modules/three/build/three.module.js'
    import { Sky } from '/node_modules/three/examples/jsm/objects/Sky.js'
    import { createNanjingWaterSurface } from '/src/editor/nanjingWaterSurface.js'

    const report = document.querySelector('#report'), status = document.querySelector('#status'), container = document.querySelector('#canvas')
    try {
      const data = await fetch('/public/water-natural-geometry.json').then(r => { if (!r.ok) throw new Error(`geometry ${r.status}`); return r.json() })
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' })
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.outputColorSpace = THREE.SRGBColorSpace
      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95
      container.append(renderer.domElement)
      const shaderErrors = []
      renderer.debug.checkShaderErrors = true
      renderer.debug.onShaderError = (gl, program, vs, fs) => shaderErrors.push({ program: gl.getProgramInfoLog(program), vertex: gl.getShaderInfoLog(vs), fragment: gl.getShaderInfoLog(fs) })

      const skyScene = new THREE.Scene(), sky = new Sky(); sky.scale.setScalar(500)
      sky.material.uniforms.turbidity.value = 2.7; sky.material.uniforms.rayleigh.value = 1.6
      sky.material.uniforms.mieCoefficient.value = .004; sky.material.uniforms.mieDirectionalG.value = .77
      const sun = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(64), THREE.MathUtils.degToRad(200))
      sky.material.uniforms.sunPosition.value.copy(sun); skyScene.add(sky)
      const pmrem = new THREE.PMREMGenerator(renderer), environment = pmrem.fromScene(skyScene, .04).texture
      pmrem.dispose()

      const geometry = new THREE.BufferGeometry()
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(data.position, 3))
      geometry.setAttribute('normal', new THREE.Float32BufferAttribute(data.normal, 3))
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(data.uv, 2))
      geometry.setIndex(data.index); geometry.computeBoundingBox(); geometry.computeBoundingSphere()
      const transform = new THREE.Matrix4().compose(new THREE.Vector3().fromArray(data.node.translation || [0, 0, 0]),
        new THREE.Quaternion().fromArray(data.node.rotation || [0, 0, 0, 1]), new THREE.Vector3(.1, .1, .1))
      const bounds = geometry.boundingBox.clone().applyMatrix4(transform), center = bounds.getCenter(new THREE.Vector3())
      let area = -1, anchor = center.clone()
      const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), ab = new THREE.Vector3(), ac = new THREE.Vector3()
      for (let i = 0; i < data.index.length; i += 3) {
        a.fromArray(data.position, data.index[i] * 3); b.fromArray(data.position, data.index[i + 1] * 3); c.fromArray(data.position, data.index[i + 2] * 3)
        const normal = ab.subVectors(b, a).cross(ac.subVectors(c, a)), nextArea = normal.length()
        if (nextArea > area && Math.abs(normal.y) > nextArea * .98) { area = nextArea; anchor.copy(a).add(b).add(c).multiplyScalar(1 / 3).applyMatrix4(transform) }
      }
      const sourceParameters = { ...data.material.pbrMetallicRoughness, baseColorFactor: [0.06662593863608139,0.13013647668074665,0.174647403645279,1] }
      function makeScene() {
        const scene = new THREE.Scene(); scene.background = new THREE.Color('#b1c7d0'); scene.environment = environment; scene.environmentIntensity = 1
        const source = new THREE.MeshPhysicalMaterial({ color: new THREE.Color().fromArray(sourceParameters.baseColorFactor),
          metalness: sourceParameters.metallicFactor, roughness: sourceParameters.roughnessFactor,
          ior: data.material.extensions.KHR_materials_ior.ior,
          specularColor: new THREE.Color().fromArray(data.material.extensions.KHR_materials_specular.specularColorFactor), side: THREE.DoubleSide })
        source.name = '远景_浅蓝水面'
        const mesh = new THREE.Mesh(geometry, source); mesh.name = '远景_休闲区域'; mesh.applyMatrix4(transform); scene.add(mesh); scene.RootMaterials = [source]
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(150, 150), new THREE.MeshStandardMaterial({ color: '#9b9b7d', roughness: 1 }))
        ground.rotation.x = -Math.PI / 2; ground.position.set(center.x, bounds.min.y - .025, center.z); scene.add(ground)
        scene.add(new THREE.HemisphereLight(0xbad4e7, 0x75795a, .7))
        const sunlight = new THREE.DirectionalLight(0xffefdb, 2.1); sunlight.position.copy(sun).multiplyScalar(70).add(center); scene.add(sunlight)
        return { scene, mesh, source }
      }
      const original = makeScene(), after = makeScene()
      const legacyController = createNanjingWaterSurface({ scene: original.scene }, { waterSurface: { version: 1, enabled: true } })
      const config = { waterSurface: { version: 1, enabled: true, style: 'natural-v2' } }
      let controller = createNanjingWaterSurface({ scene: after.scene }, config)
      const serialize = controller.withOriginals(() => ({ sourceIdentity: after.mesh.material === after.source,
        listIdentity: after.scene.RootMaterials[0] === after.source, noGeneratedNormalMap: after.source.normalMap === null,
        config: JSON.parse(JSON.stringify(controller.getStatus().settings)) }))
      controller.dispose()
      controller = createNanjingWaterSurface({ scene: after.scene }, { waterSurface: serialize.config })
      serialize.reopened = controller.getStatus().active && after.mesh.material.metalness === 0 && after.source.metalness === sourceParameters.metallicFactor
      serialize.geometryIdentity = original.mesh.geometry === after.mesh.geometry && geometry.attributes.position.count === 409 && geometry.index.count === 1023

      const camera = new THREE.PerspectiveCamera(44, 1, .02, 600)
      const views = {
        overview: { target: center.clone(), offset: new THREE.Vector3(21, 30, 29) },
        near: { target: anchor.clone(), offset: new THREE.Vector3(1.15, 2.6, 3.15) },
        grazing: { target: anchor.clone(), offset: new THREE.Vector3(1.2, .65, 3.6) }
      }
      let currentView = 'near'
      function setCamera(name, aspect) {
        const view = views[name]; camera.position.copy(view.target).add(view.offset); camera.lookAt(view.target)
        camera.aspect = aspect; camera.updateProjectionMatrix(); camera.updateMatrixWorld(true)
      }
      function render() {
        const width = container.clientWidth, height = container.clientHeight, half = Math.floor(width / 2)
        renderer.setSize(width, height, false); renderer.setRenderTarget(null); renderer.setScissorTest(true)
        setCamera(currentView, half / height)
        renderer.setViewport(0, 0, half, height); renderer.setScissor(0, 0, half, height); renderer.render(original.scene, camera)
        renderer.setViewport(half, 0, width - half, height); renderer.setScissor(half, 0, width - half, height); renderer.render(after.scene, camera)
        renderer.setScissorTest(false)
      }
      function pixels(scene, target) {
        renderer.setRenderTarget(target); renderer.setViewport(0, 0, target.width, target.height); renderer.setScissorTest(false); renderer.render(scene, camera)
        const bytes = new Uint8Array(target.width * target.height * 4); renderer.readRenderTargetPixels(target, 0, 0, target.width, target.height, bytes); return bytes
      }
      function comparePixels() {
        const comparisons = [], target = new THREE.WebGLRenderTarget(320, 240)
        for (const view of Object.keys(views)) {
          setCamera(view, 320 / 240)
          const before = pixels(original.scene, target), afterBytes = pixels(after.scene, target)
          let absolute = 0, changed = 0, brightBefore = 0, brightAfter = 0
          for (let i = 0; i < before.length; i += 4) {
            const difference = Math.abs(before[i] - afterBytes[i]) + Math.abs(before[i + 1] - afterBytes[i + 1]) + Math.abs(before[i + 2] - afterBytes[i + 2])
            absolute += difference; if (difference > 6) changed++
            if (Math.min(before[i], before[i + 1], before[i + 2]) > 220) brightBefore++
            if (Math.min(afterBytes[i], afterBytes[i + 1], afterBytes[i + 2]) > 220) brightAfter++
          }
          comparisons.push({ view, changedPixels: changed, changedPercent: +(changed / (320 * 240) * 100).toFixed(2),
            meanAbsoluteRGB: +(absolute / (320 * 240 * 3)).toFixed(3), brightPixelsBefore: brightBefore, brightPixelsAfter: brightAfter })
        }
        target.dispose(); renderer.setRenderTarget(null); return comparisons
      }
      function verify() {
        const comparisons = comparePixels(), surface = controller.getStatus()
        const result = { pass: shaderErrors.length === 0 && surface.shaderErrors === 0 && serialize.reopened && serialize.geometryIdentity && comparisons.every(c => c.changedPixels > 0),
          shaderErrors, patchErrors: surface.shaderErrors, view: currentView, geometry: { vertices: geometry.attributes.position.count, indices: geometry.index.count, sharedOriginalBuffer: serialize.geometryIdentity },
          comparisons, serialization: serialize, settings: surface.settings,
          performance: { extraPasses: surface.extraRenderPasses, extraDraws: surface.extraDrawCalls, textureSamples: surface.textureSamples, textureBytes: surface.textureBytes, animated: surface.animated } }
        report.textContent = JSON.stringify(result, null, 2); report.dataset.result = JSON.stringify(result)
        status.textContent = result.pass ? 'GPU 编译通过 · 三个视角存在可测差异 · 保存 / 重开通过' : '检查未通过，请查看明细'
        window.waterCheck = result; render()
      }
      document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
        currentView = button.dataset.view
        document.querySelectorAll('[data-view]').forEach(item => item.setAttribute('aria-pressed', String(item === button)))
        verify()
      }))
      document.querySelector('#strength').addEventListener('input', event => {
        document.querySelector('#strength-value').value = Number(event.target.value).toFixed(2)
        controller.update({ rippleStrength: Number(event.target.value) }); verify()
      })
      new ResizeObserver(render).observe(container)
      verify()
    } catch (error) {
      status.textContent = '验证页面加载失败'
      report.textContent = error.stack || String(error); report.dataset.result = JSON.stringify({ pass: false, error: report.textContent })
    }
  </script>
</body>
</html>
