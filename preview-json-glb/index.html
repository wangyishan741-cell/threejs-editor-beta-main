<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON + GLB Preview</title>
  </head>
  <body>
    <div id="app">
      <aside class="panel">
        <div class="brand">
          <span class="eyebrow">Three.js 验证台</span>
          <h1>JSON + GLB Preview</h1>
          <p>加载编辑器 JSON，检查其中的 GLB/GLTF 引用、基础场景参数和模型动画。</p>
        </div>

        <section class="card">
          <label for="jsonUrl">JSON 地址</label>
          <div class="row">
            <input id="jsonUrl" type="text" value="/src/json/三维测试.json" />
            <button id="loadJsonUrl">加载</button>
          </div>
          <label class="file-drop" for="jsonFile">
            <input id="jsonFile" type="file" accept=".json,application/json" />
            <strong>选择或拖入 JSON</strong>
            <span>支持编辑器导出的 scene json</span>
          </label>
        </section>

        <section class="card">
          <label for="glbUrl">单独 GLB / GLTF 地址</label>
          <div class="row">
            <input id="glbUrl" type="text" value="https://z2586300277.github.io/3d-file-server/examples/coffeeMug/coffeeMug.glb" />
            <button id="loadGlbUrl">叠加</button>
          </div>
          <label class="file-drop" for="glbFile">
            <input id="glbFile" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" />
            <strong>选择或拖入 GLB</strong>
            <span>用于和 JSON 场景做对照验证</span>
          </label>
        </section>

        <section class="card compact">
          <label>显示选项</label>
          <div class="switches">
            <button id="toggleGrid" class="toggle is-on">Grid</button>
            <button id="toggleAxes" class="toggle is-on">Axes</button>
            <button id="frameScene">聚焦</button>
            <button id="clearScene">清空</button>
          </div>
        </section>

        <section class="card status-card">
          <label>加载状态</label>
          <pre id="status">等待加载...</pre>
        </section>
      </aside>

      <main class="stage">
        <canvas id="previewCanvas"></canvas>
        <div class="drop-hint" id="dropHint">把 JSON / GLB 拖到这里</div>
      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
